 knowledge:[
 {id:'K01',category:'labor',type:'internal',date:'2026-11-02',title:['Как запросить шаблон заявления на отпуск','如何获取休假申请模板','Requesting a leave application template'],summary:['В учебной компании шаблон выдает HR. Укажите желаемые даты и согласуйте процесс с руководителем; сроки и право на отпуск здесь не оцениваются.','演示公司由HR提供模板。注明期望日期并与主管确认流程，本样本不评估休假权利或期限。','In the demo company HR provides the template. State preferred dates and confirm the process with your manager; leave entitlement and deadlines are not assessed here.']},
 {id:'K02',category:'contracts',type:'internal',date:'2026-11-03',title:['NDA: чек-лист до передачи информации','NDA：信息披露前检查清单','NDA: checklist before disclosure'],summary:['Определите стороны, цель обмена, состав конфиденциальной информации, срок и доступ. В учебном процессе выберите внутренний шаблон NDA; отклонения от него передайте юристу. Не раскрывайте сведения только на основании этого проекта ответа.','明确当事方、交换目的、保密信息范围、期限和访问权限。演示流程使用内部NDA模板，偏离模板需交法务。不得仅凭本草稿披露信息。','Identify parties, exchange purpose, confidential scope, duration and access. Use the internal NDA template in the demo workflow; refer deviations to counsel. This draft alone does not authorize disclosure.']},
 {id:'K03',category:'contracts',type:'internal',date:'2026-11-04',title:['Учебный регламент согласования договоров','演示合同审批规程','Demo contract approval policy'],summary:['Вымышленная компания направляет сделки от 1 млн ₽ на проверку, от 5 млн ₽ — на обязательную передачу юристу. До согласования соберите проект, сумму, предмет и сведения о контрагенте. Это внутренние учебные пороги.','虚构公司对100万卢布起的交易进行审核，500万卢布起必须转交法务。审批前收集草稿、金额、标的及交易方信息。这些仅为内部教学阈值。','The fictional company reviews transactions from RUB 1m and requires legal handoff from RUB 5m. Collect the draft, value, subject and counterparty details. These are internal educational thresholds.']},
 {id:'K04',category:'personal',type:'internal',date:'2026-11-05',title:['Чек-лист передачи персональных данных','个人信息传输检查清单','Personal data transfer checklist'],summary:['До передачи юрист и ответственный за ПДн проверяют цель, правовое основание, категории данных, получателя, меры защиты и возможный трансграничный элемент. Наличие согласия само по себе не подтверждает допустимость любой передачи.','传输前由法务及数据负责人核验目的、法律依据、数据类别、接收方、安全措施和跨境因素。取得同意不代表任何传输均合法。','Before transfer, counsel and the data lead review purpose, legal basis, categories, recipient, safeguards and cross-border factors. Consent alone does not establish that any transfer is permissible.']},
 {id:'K05',category:'labor',type:'reference',date:'2026-11-05',title:['Дистанционная работа из другой страны: вопросы для юриста','境外远程工作：法务核查事项','Remote work abroad: questions for counsel'],summary:['Уточните страну, срок пребывания, условия договора, гражданство и доступ к данным. Учебная памятка не устанавливает допустимость работы за рубежом: требуется индивидуальная оценка юриста и HR.','明确国家、停留期限、合同条款、国籍和数据访问情况。本教学说明不判断境外工作的合法性，需由法务与HR逐案评估。','Clarify country, duration, contract terms, citizenship and data access. This note does not determine whether work abroad is permissible; counsel and HR must assess the case.']},

 {id:'K07',category:'claims',type:'internal',date:'2026-11-06',title:['Первичные действия при получении претензии','收到索赔后的初步步骤','First steps after receiving a claim'],summary:['Сохраните претензию и подтверждение получения, зафиксируйте даты, договор и переписку. Незамедлительно передайте юристу для оценки сроков. Не признавайте долг и не обещайте выплату без согласования.','保存索赔及收件凭证，记录日期、合同和往来材料。及时转交法务评估期限，未经审批不承认债务或承诺付款。','Preserve the claim and proof of receipt; record dates, contract and correspondence. Refer promptly to counsel to assess deadlines. Do not acknowledge liability or promise payment without approval.']},
 {id:'K08',category:'compliance',type:'internal',date:'2026-11-01',title:['Запрос регулятора: внутренняя маршрутизация','监管要求：内部分流流程','Regulator request: internal routing'],summary:['Зарегистрируйте запрос, сохраните оригинал и дату получения. Передайте юристу; состав ответа и сроки определяются после проверки содержания и полномочий отправителя.','登记要求并保存原件及收件日期。转交法务，在核验内容及发件方权限后确定答复内容和期限。','Register the request and preserve the original and receipt date. Refer to counsel; response scope and deadlines follow review of content and sender authority.']},
 {id:'K09',category:'personal',type:'official',date:'2026-11-09',url:'https://mintrud.gov.ru/docs/laws/130',title:['О персональных данных — ресурс Минтруда России','俄罗斯劳动部：个人信息法官方资源','Personal data law — Russian Ministry of Labour resource'],summary:['Ссылка на официальный государственный ресурс о Федеральном законе «О персональных данных». Это указатель источника, а не загруженная актуальная редакция. Для решения необходимо отдельно проверить действующий текст.','指向俄罗斯政府关于《个人信息法》的官方资源。仅为来源目录，未载入现行全文，实际决策须另行核验现行文本。','Link to an official government resource on the Personal Data Federal Law. This is a source pointer, not a loaded current edition. Verify the applicable text separately before a decision.']}

 {title:['Цель и границы','目标与范围','Purpose and scope'],text:['Снизить нагрузку на юридический отдел за счет первичной классификации, структурирования фактов и маршрутизации. Область: трудовые, договорные, корпоративные вопросы, персональные данные, интеллектуальная собственность, комплаенс и претензии. Неизвестные вопросы переходят в «Прочие».','通过初步分类、整理事实和分流减轻法务负担。范围包括劳动、合同、公司事务、个人信息、知识产权、合规和索赔。无法识别的问题归入其他。','Reduce legal intake workload through initial classification, structured facts and routing. Coverage includes employment, contracts, corporate matters, personal data, IP, compliance and claims. Unknown questions go to Other.']},
 {title:['Структура базы знаний','知识库结构','Knowledge structure'],text:['Хранить отдельно внутренние шаблоны, справочные материалы и официальные источники. Для каждого материала нужны владелец, версия, дата проверки и статус. В будущем — проверка актуальности, разграничение доступа и поиск фрагментов с указанием источников; сейчас — подбор по категории и ключевым словам.','内部模板、参考材料和官方来源分别存放。每项材料需有负责人、版本、核验日期和状态。未来实现时效核验、权限控制和带来源的片段检索，目前仅按类别和关键词匹配。','Separate internal templates, reference notes and official sources. Each needs an owner, version, review date and status. Future work includes currency checks, access control and cited passage retrieval; this prototype matches categories and keywords.']},
 {title:['Локальная модель и человеческий контроль','本地模型与人工监督','Local model and human oversight'],text:['В будущем локальная модель поможет извлекать факты, искать материалы и формировать проект ответа в инфраструктуре компании. Матрица должна ограничивать автоматизацию независимо от уверенности модели. Средний риск требует проверки, высокий — обязательного участия юриста. Локальное размещение само по себе не гарантирует безопасность или достоверность.','未来本地模型将在公司基础设施内辅助提取事实、检索材料及起草答复。无论模型置信度如何，矩阵都应限制自动处理。中风险需审核，高风险必须由法务介入。本地部署本身不能保证安全或准确性。','A future local model would extract facts, retrieve materials and draft responses within company infrastructure. The matrix must constrain automation regardless of model confidence. Medium risk requires review; high risk requires counsel. Local hosting alone guarantees neither safety nor accuracy.']},
 {title:['Российский правовой контекст','俄罗斯法律背景','Russian legal context'],text:['Для реальной системы юрист проверяет применимые положения трудового и гражданского законодательства, требований к персональным данным и конфиденциальности. Ответ зависит от обстоятельств и действующей редакции источников. Прототип не определяет законность сделки, принадлежность прав или допустимость передачи данных.','实际系统需由法务核验适用的劳动法、民法、个人信息及保密要求。答复取决于事实及现行法律文本。本原型不判定交易合法性、权属或数据传输是否合法。','For a real system counsel must verify applicable employment, civil, data protection and confidentiality requirements. Answers depend on facts and current sources. The prototype does not determine transaction legality, ownership or lawfulness of data transfers.']},
 {title:['Конфиденциальность и доступ','保密与访问控制','Confidentiality and access'],text:['До внедрения нужны минимизация данных, ролевая модель доступа, сроки хранения, журнал действий и меры защиты. Сотрудник видит свои обращения, юрист — назначенные, администратор — настройки без избыточного доступа к содержанию. Эти роли в прототипе описаны, но не реализованы. Не вводите реальные персональные или конфиденциальные сведения.','上线前需落实数据最小化、角色权限、保存期限、操作日志及安全措施。员工查看自己的请求，法务查看被分配的请求，管理员管理设置并避免过度访问内容。本原型仅描述这些角色，未实现权限控制。请勿输入真实个人信息或机密内容。','Deployment needs data minimization, role-based access, retention periods, activity logs and safeguards. Employees see their requests, counsel sees assigned cases, and admins manage settings without excessive content access. These roles are described but not implemented. Do not enter real personal or confidential data.']}

/* Source: engine.js */
/* Pure deterministic classifier shared by free-form intake and scenario checks. */
LH.engine = (() => {
 const patterns = {
  labor:/отпуск|трудов|работник|сотрудник|дистанцион|劳动|员工|休假|远程|employee|employment|leave application|remote work/iu,
  contracts:/договор|подрядчик|контракт|\bnda\b|合同|承包商|保密协议|contract|contractor/iu,
  personal:/персональн|биометр|личные данные|个人信息|个人数据|生物识别|personal data|biometric/iu,
  ip:/исключительн|программное обеспечение|авторск|интеллектуальн|知识产权|软件|著作权|专有权|software|copyright|intellectual property/iu,
  corporate:/корпоративн|учредител|акционер|дивиденд|устав|股东|公司章程|股息|shareholder|dividend|articles of association/iu,
  compliance:/комплаенс|регулятор|санкци|взятк|подарок|合规|监管|制裁|贿赂|礼品|compliance|regulator|sanction|bribe|gift/iu,
  claims:/претензи|судебн|иск\b|спор\b|索赔|诉讼|争议|\bclaim\b|litigation|lawsuit|\bdispute\b/iu
 };
 function parseAmount(text) {
  const normalized = text.replace(/(\d)[\s\u00a0\u202f,](?=\d{3}(?:\D|$))/g,'$1').replace(/(\d)[\s\u00a0\u202f,](?=\d{3}(?:\D|$))/g,'$1');
  const match = normalized.match(/(\d+(?:[.,]\d+)?)\s*(млн|миллион\w*|million|万|百万)?\s*(?:₽|руб\w*|rub\b|卢布)/iu);
  if(!match) return 0;
  const multiplier = /万/.test(match[2]||'') ? (match[2]==='百万'?1e6:1e4) : match[2]?1e6:1;
  return Number(match[1].replace(',','.'))*multiplier;
 }
 function analyze(input) {
  const text = (input.question||'')+' '+(input.details||'');
  let categories = Object.keys(patterns).filter(key=>patterns[key].test(text));
  // Employee-created software is an IP issue here; employment wording is context.
  if(categories.includes('ip') && !/отпуск|дистанцион|休假|远程|remote|leave application/iu.test(text)) categories=categories.filter(c=>c!=='labor');
  if(!categories.length) categories=['other'];
  const amount = Math.max(Number(input.amount)||0,parseAmount(text));
  const international = input.international || /другой стран|за рубеж|трансгранич|международ|国外|跨境|another country|abroad|cross.border|international/iu.test(text);
  const sensitive = input.sensitive || /чувствительн|биометр|здоровь|敏感|生物识别|健康|sensitive|biometric|health data/iu.test(text);
  const dispute = input.dispute || patterns.claims.test(text) || /запрос регулятора|监管机关|regulator request/iu.test(text);
  if(sensitive && !categories.includes('personal')) {categories=categories.filter(c=>c!=='other'); categories.push('personal');}
  const ids=[];
  if(amount>=LH.data.thresholds.high) ids.push('R03'); else if(amount>=LH.data.thresholds.review) ids.push('R02');
  if(categories.includes('personal') && (sensitive||/переда|передать|получ|接收|传输|共享|transfer|receive|shar/iu.test(text))) ids.push('R04');
  if(international) ids.push('R05');
  if(dispute) ids.push('R06');
  if(categories.length>1) ids.push('R08');
  if(categories.some(c=>['ip','personal','corporate','compliance'].includes(c))) ids.push('R09');
  // Narrow curated coverage: unknown questions within a category still escalate.
  const sourceIds=[];
  if(categories.includes('labor')&&/отпуск|休假|leave application/iu.test(text)) sourceIds.push('K01');
  if(categories.includes('labor')&&international) sourceIds.push('K05');
  if(categories.includes('contracts')&&/nda|保密协议/iu.test(text)) sourceIds.push('K02');
  if(categories.includes('contracts')&&(/согласован|стоимост|сумм|审批|金额|approval|worth|value/iu.test(text)||amount)) sourceIds.push('K03');
  if(categories.includes('personal')) sourceIds.push('K04');
  if(categories.includes('ip')) sourceIds.push('K06');
  if(categories.includes('claims')) sourceIds.push('K07');
  if(categories.includes('compliance')&&/регулятор|监管|regulator/iu.test(text)) sourceIds.push('K08');
  const insufficient=!sourceIds.length || /других сведений|недостаточно|не знаю|没有其他信息|信息不足|no other details|not enough information/iu.test(text);
  if(insufficient) ids.push('R07');
  if(!ids.length) ids.push('R01');
  const rules = ids.map(id=>LH.data.rules.find(r=>r.id===id));
  const risk = rules.some(r=>r.risk==='high')?'high':rules.some(r=>r.risk==='medium')?'medium':'low';
  return {categories,risk,rules:ids,sourceIds,insufficient,amount,international:!!international,sensitive:!!sensitive,dispute:!!dispute,route:risk==='high'?'escalation':risk==='medium'?'lawyerReview':'automatic'};
 }

 function openKnowledge(id){const k=LH.data.knowledge.find(v=>v.id===id);showModal(`<div class="eyebrow">${k.id} · ${t(k.type)}</div><h2>${esc(p(k.title))}</h2><p>${esc(p(k.summary))}</p><p class="fineprint">${t('updated')}: ${k.date} · ${t('status')}: ${t(k.type==='official'?'verify':'sample')}</p>${k.url?`<a class="primary" href="${k.url}" target="_blank" rel="noopener noreferrer">${t('sourceLink')}</a>`:''}${notice(k.type==='official'?'kbNotice':'draftWarning')}`);}
 function collectForm(){const form=$('#request-form');if(!form)return;const values=new FormData(form);state.form={question:values.get('question'),department:values.get('department'),urgency:values.get('urgency'),details:values.get('details'),amount:values.get('amount'),international:values.has('international'),sensitive:values.has('sensitive'),dispute:values.has('dispute')};}
 async function submit(event){event.preventDefault();collectForm();if(state.busy)return;if(state.form.question.trim().length<12){toast(t('required'));return;}state.busy=true;state.step=0;state.selected=null;const input={...state.form};render();for(let i=0;i<5;i++){state.step=i;if(state.page==='requests')$('#processing-region').innerHTML=processView();await new Promise(resolve=>setTimeout(resolve,400));}const result=LH.engine.analyze(input);const scenario=LH.data.scenarios.find(s=>s.question.includes(input.question)&&(!input.details));const r={id:'LH-'+(111+state.history.length-10),input,result,scenario:scenario?.id,date:new Date().toISOString(),queued:false};state.history.unshift(r);state.selected=r;state.busy=false;render();if(state.page==='requests')$('#processing-region').scrollIntoView({behavior:'smooth',block:'start'});}
 function download(format){const content=documentText();const text=format==='html'?`<!doctype html><html lang="${LH.locale}"><meta charset="utf-8"><title>${esc(t('documentTypes')[Number(state.doc.type)])}</title><style>body{max-width:800px;margin:48px auto;padding:24px;font:16px/1.7 system-ui;color:#17243e}pre{white-space:pre-wrap;font:inherit}h1{font-size:24px}</style><h1>${esc(t('documentTypes')[Number(state.doc.type)])}</h1><pre>${esc(content)}</pre></html>`:content;const url=URL.createObjectURL(new Blob(['\ufeff',text],{type:format==='html'?'text/html;charset=utf-8':'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`Legal-Helpdesk-${state.doc.source||'draft'}-${LH.locale}.${format}`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(t('saved'));}
 document.addEventListener('click',async event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action,id=el.dataset.id;
  if(pages.includes(action)){location.hash=action;return;}
  if(action==='new'){state.selected=null;location.hash='requests';if(state.page==='requests')render();}
  if(action==='reset'){state.form={question:'',department:'hr',urgency:'normal',details:'',amount:'',international:false,sensitive:false,dispute:false};state.selected=null;render();}
  if(action==='example'){const s=LH.data.scenarios.find(v=>v.id===id);state.form={question:p(s.question),department:s.department,urgency:'normal',details:'',amount:s.amount||'',international:!!s.international,sensitive:!!s.sensitive,dispute:!!s.dispute};state.selected=null;location.hash='requests';navigate('requests');$('#question').focus();}
  if(action==='open'){const r=state.history.find(v=>v.id===id);state.selected=r;showModal(resultView(r));}
  if(action==='knowledge-item')openKnowledge(id);
  if(action==='close')$('#modal').close();
  if(action==='queue'){const r=state.history.find(v=>v.id===id);r.queued=true;render();if($('#modal').open)showModal(resultView(r));toast(t('queuedToast'));}
  if(action==='make-doc'){state.doc.source=id;state.doc.notes=state.history.find(r=>r.id===id)?.input.details||'';$('#modal').close();location.hash='documents';navigate('documents');}
  if(action==='test'){state.tests=true;render();}
  if(action==='txt'||action==='html')download(action);
  if(action==='copy'){try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(documentText());else{const area=document.createElement('textarea');area.value=documentText();document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();if(!ok)throw Error('copy');}toast(t('copied'));}catch{toast(t('copyFailed'));}}
 });
 document.addEventListener('submit',e=>{if(e.target.id==='request-form')submit(e);});
 document.addEventListener('input',e=>{if(e.target.closest('#request-form'))collectForm();if(e.target.id==='kb-search'){state.kb.search=e.target.value;kbResults();}if(e.target.dataset.doc){state.doc[e.target.dataset.doc]=e.target.value;$('#document-preview').textContent=documentText();}});
 document.addEventListener('change',e=>{const el=e.target;if(el.id==='language'){collectForm();const old=LH.locale;LH.locale=el.value;const s=LH.data.scenarios.find(v=>v.question[LH.languages.indexOf(old)]===state.form.question);if(s)state.form.question=p(s.question);if($('#modal').open)$('#modal').close();render();}if(el.id==='kb-category'||el.id==='kb-type'){state.kb[el.id==='kb-type'?'type':'category']=el.value;kbResults();}if(el.id==='doc-type'){state.doc.type=el.value;$('#document-preview').textContent=documentText();}if(el.id==='doc-source'){state.doc.source=el.value;state.doc.notes=docSource()?.input.details||'';render();}});
 window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));
 navigate(location.hash.slice(1)||'overview');
})();

</script>
</body>
</html>
